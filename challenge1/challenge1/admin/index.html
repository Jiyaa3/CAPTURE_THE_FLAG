<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>RootJ Logistics - Admin Portal</title>

<style>

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#eef2f7;
    margin:0;
}

header{
    background:#1d3557;
    color:white;
    padding:20px;
}

.container{
    width:400px;
    margin:70px auto;
    background:white;
    padding:30px;
    border-radius:10px;
    box-shadow:0 5px 20px rgba(0,0,0,.15);
}

input{
    width:100%;
    padding:12px;
    margin-top:10px;
    margin-bottom:20px;
    border:1px solid #ccc;
    border-radius:5px;
    box-sizing:border-box;
}

button{
    width:100%;
    padding:12px;
    background:#1d3557;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#274d82;
}

.notice{
    margin-top:20px;
    color:#666;
    font-size:13px;
    text-align:center;
}

.version{
    margin-top:30px;
    text-align:center;
    color:gray;
    font-size:12px;
}

</style>

</head>

<body>

<header>

<h2>🔒 RootJ Logistics Admin Portal</h2>

</header>

<div class="container">

<h3>Administrator Login</h3>

<form>

<input type="text" placeholder="Username">

<input type="password" placeholder="Password">

<button type="button">Sign In</button>

</form>

<div class="notice">

<strong>Authorized Personnel Only</strong>

<br><br>

Unauthorized access is prohibited and monitored.

</div>

<div class="version">

Build 2.8.17 • QA Environment

</div>

</div>

</body>

</html>
